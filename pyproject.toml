[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-thermal-power-predictor"
version = "1.0.0"
description = "Five-minute CPU temperature and node-power forecasting from M100 HPC telemetry"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Susheel Maurya" }]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest_temp"
testpaths = ["tests"]
pythonpath = ["."]
